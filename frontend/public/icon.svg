<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Home-screen icon: the sidebar's brand mark on the app's
       background, full-bleed so Android can mask it to any shape.
       The mark stays inside the central 80% safe zone. -->
  <rect width="512" height="512" fill="#16181d"/>
  <rect x="136" y="136" width="240" height="240" rx="56"
        fill="rgba(76,158,255,0.15)" stroke="#4c9eff" stroke-width="8"/>
  <g transform="translate(160 160) scale(6)">
    <path d="M6 22 L11 10 L16 18 L21 12 L26 22" fill="none" stroke="#4c9eff"
          stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="26" cy="22" r="1.8" fill="#4c9eff"/>
  </g>
</svg>
