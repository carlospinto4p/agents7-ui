[project]
name = "agents7-ui-backend"
version = "0.29.2"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "agents7[anthropic,openai]>=4.0.0",
    "pyyaml>=6.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
agents7 = { path = "../../agents7_framework", editable = true }
