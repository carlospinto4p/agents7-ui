services:
  backend:
    build:
      context: .
      dockerfile: agents7_ui/Dockerfile.backend
    # Secrets (API_KEY, provider keys) go here; gitignored, optional.
    # See agents7_ui/.env.example for the documented variables.
    env_file:
      - path: agents7_ui/.env
        required: false
    environment:
      # Ollama is bundled in this container; the backend talks to it on
      # localhost and can start it on demand via POST /api/engine/start.
      - OLLAMA_HOST=http://localhost:11434
      - ALLOW_ENGINE_START=1
      # Allowed browser origin. Same-origin via nginx in this stack, so the
      # default covers it; set explicitly for a different host/port.
      - CORS_ORIGINS=http://localhost:8080
    volumes:
      # Persist pulled models across container restarts.
      - ollama_models:/root/.ollama
    # GPU (optional): requires the NVIDIA container toolkit on the host.
    # Uncomment to hand Ollama the GPU; otherwise it runs on CPU.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  frontend:
    build:
      context: agents7_ui
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    post_start:
      - command: ["sh", "-c", "echo 'Frontend: http://localhost:8080'"]

volumes:
  ollama_models:
