services:
  backend:
    build:
      context: .
      dockerfile: agents7_ui/Dockerfile.backend
    # Secrets (API_KEY, provider keys) go here; gitignored, optional.
    # See agents7_ui/.env.example for the documented variables.
    env_file:
      - path: agents7_ui/.env
        required: false
    environment:
      # Reach the host's Ollama service. The host service must listen on a
      # docker-reachable address (e.g. OLLAMA_HOST=0.0.0.0:11434 in its
      # systemd unit) — a loopback bind is not reachable from containers.
      - OLLAMA_HOST=http://host.docker.internal:11434
      # Allowed browser origin. Same-origin via nginx in this stack, so the
      # default covers it; set explicitly for a different host/port.
      - CORS_ORIGINS=http://localhost:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: agents7_ui
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    post_start:
      - command: ["sh", "-c", "echo 'Frontend: http://localhost:8080'"]
