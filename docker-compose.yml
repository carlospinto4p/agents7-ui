services:
  backend:
    build:
      context: .
      dockerfile: agents7_ui/Dockerfile.backend
    # Secrets (API_KEY, provider keys) go here; gitignored, optional.
    # See agents7_ui/.env.example for the documented variables.
    env_file:
      - path: agents7_ui/.env
        required: false
    environment:
      # Reach the host's Ollama on the docker0 bridge IP. The host service
      # must bind this address (Environment="OLLAMA_HOST=172.17.0.1:11434"
      # in its systemd unit, ordered After=docker.service) so it is exposed
      # to docker containers only — not on the host's LAN interfaces.
      - OLLAMA_HOST=http://172.17.0.1:11434
      # Allowed browser origin. Same-origin via nginx in this stack, so the
      # default covers it; set explicitly for a different host/port.
      - CORS_ORIGINS=http://localhost:8080

  frontend:
    build:
      context: agents7_ui
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    post_start:
      - command: ["sh", "-c", "echo 'Frontend: http://localhost:8080'"]
