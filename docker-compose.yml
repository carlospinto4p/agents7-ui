services:
  backend:
    build:
      context: .
      dockerfile: agents7_ui/Dockerfile.backend
    # Secrets (API_KEY, provider keys) go here; gitignored, optional.
    # See agents7_ui/.env.example for the documented variables.
    env_file:
      - path: agents7_ui/.env
        required: false
    environment:
      # Reach the host's Ollama. NOTE: the host service binds localhost by
      # default, which containers cannot reach — to use this compose stack,
      # rebind the host Ollama to a docker-reachable address (e.g.
      # OLLAMA_HOST=0.0.0.0:11434 in its systemd unit). See README.md.
      - OLLAMA_HOST=http://host.docker.internal:11434
      # Allowed browser origin. Same-origin via nginx in this stack, so the
      # default covers it; set explicitly for a different host/port. Tracks
      # the frontend's published host port (FRONTEND_PORT, default 5185).
      - CORS_ORIGINS=http://localhost:${FRONTEND_PORT:-5185}
      # Root for file-based WARNING/ERROR logs (-> /app/logs, bind-mounted
      # below). See agents7_ui/backend/logging_setup.py.
      - LOGS_DIR=/app
    volumes:
      # First-party WARNING/ERROR records, surfaced on the host.
      - ./agents7_ui/logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: agents7_ui
      dockerfile: Dockerfile.frontend
    # Registry-claimed host port (never the shared 8080 default). Override
    # with FRONTEND_PORT; the banner below reads the same value so they
    # cannot drift.
    ports:
      - "${FRONTEND_PORT:-5185}:80"
    depends_on:
      - backend

  # Prints the clickable host URL once the stack is up so the user
  # doesn't have to read this file to find where the app is served.
  # Reads the SAME env var the ports: mapping binds, so the banner can
  # never drift from the actual binding. Only the frontend publishes a
  # host port here — the backend is container-internal (reached via
  # nginx same-origin), so there is nothing else to advertise.
  banner:
    image: busybox
    depends_on:
      - frontend
    command: >
      sh -c 'echo "" &&
        echo "  ➜  App: http://localhost:${FRONTEND_PORT:-5185}" &&
        echo ""'
